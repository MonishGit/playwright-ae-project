name: Playwright Tests

# ── Triggers ─────────────────────────────────────────────────
# Pipeline runs automatically on every push to main
# AND on every Pull Request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Jobs ─────────────────────────────────────────────────────
jobs:
  test:
    # Fresh Ubuntu VM — nothing installed, clean slate every run
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Checkout your code onto the runner
      # Without this the VM has no files to work with
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Node.js on the fresh VM
      # Specifies exact version for consistency
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache node_modules between runs — faster pipeline
          cache: 'npm'

      # Step 3 — Install exact dependency versions from lock file
      # npm ci = clean install, reads package-lock.json strictly
      # Never use npm install in CI — it can change versions
      - name: Install dependencies
        run: npm ci

      # Step 4 — Download Playwright browser binaries + OS dependencies
      # --with-deps installs system libraries Chromium needs on Ubuntu
      # THIS IS THE STEP MOST PEOPLE FORGET IN JENKINS
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Step 5 — Run all tests headless
      # process.env.CI=true is set automatically by GitHub Actions
      # This triggers: retries=2, workers=2 from your config
      - name: Run Playwright tests
        run: npx playwright test

      # Step 6 — Upload HTML report as artifact
      # always() means this runs even if tests fail
      # Without always() — failed pipeline skips the report upload
      # and you have no evidence of what failed
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          # Keep report for 30 days
          retention-days: 30

      # Step 7 — Upload JUnit XML for CI dashboard
      # GitHub Actions reads this and shows test counts in the UI
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results.xml
          retention-days: 30